        <!-- Navigation links -->

        <div class="content-container">
            <!-- Contact page section -->
            <div id="contact-container">
                <div id="contact-profiles">
                    <div>
                        <img src="img/facebook.png" alt="Facebook logo"><span>Matthew Gabriel Lucas</span>
                    </div>
                    <div>
                        <img src="img/github.png" alt="Github logo"><span>sudosupercat</span>
                    </div>
                    <div>
                        <img src="img/email.png" alt="Email logo"><span>matthewgabriel(dot)lucas(at)gmail.com</span>
                    </div>
                </div>
                <div id="contact-leave-message">
                    <h3>Leave a message</h3>
                    <form>
                        <label for="sender-name">Name:</label><br>
                        <input type="text" id="sender-name" name="sender-name"><br>
                        <label for="sender-email">Email:</label><br>
                        <input type="email" id="sender-email" name="sender-email"><br>
                        <label for="sender-message">Your message:</label><br>
                        <input type="text" id="sender-message" name="sender-message"><br>
                        <label for="sender-message">Pronouns:</label><br>
                        <input type="radio" id="he-him" name="pronouns" value="He/Him">
                        <label for="he-him">He/Him</label>
                        <input type="radio" id="she-her" name="pronouns" value="She/Her">
                        <label for="she-her">She/Her</label>
                        <input type="radio" id="they-them" name="pronouns" value="They/Them">
                        <label for="they-them">They/Them</label><br>
                        <input type="submit" value="Submit">
                    </form>
                </div>
            </div>
        </div>
